# small-history with a hidden set that is genuinely unlike the training set.
#
# Module 3 measured a generalisation gap of +0.02 and concluded that patterns 6-8
# are too close in shape to 1-5 for the check to mean anything: a template learned
# on one transfers to the other. This dataset keeps the five training patterns
# exactly as they are and replaces the hidden three with two whose edges are, one
# at a time, ordinary cross-team grants. What is wrong about them lives in the
# group: a closed ring of reciprocal grants, and a convergence of many people on a
# single bucket.
name: small-divergent
seed: 20260912
eval_window_days: 7

org:
  departments: 3
  teams_per_department: [2, 3]
  users_per_team: [3, 6]
  projects_per_team: [1, 2]
  objects_per_bucket: [200, 400]
  cross_cutting_groups: 1
  cross_cutting_membership_rate: 0.08
  legitimate_exception_rate: 0.04

timeline:
  start_ts: 1735689600000   # 2025-01-01T00:00:00Z
  days: 60
  working_hours: [9, 19]
  off_hours_rate: 0.05
  weekend_rate: 0.08
  hires_per_day: 0.5
  departures_per_day: 0.15
  grants_per_day: 120.0
  uploads_per_day: 50.0

anomalies:
  patterns:
    - self_grant_admin
    - privileged_group_join
    - grant_burst
    - hierarchy_bypass
    - cross_department
    - mutual_grant_ring
    - convergent_access
  rate: 0.02
  train_contamination: 0.0
  train_patterns:
    - self_grant_admin
    - privileged_group_join
    - grant_burst
    - hierarchy_bypass
    - cross_department
  train_rate: 0.004
