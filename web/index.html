<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обзор изменений прав доступа</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="top">
    <span class="brand">Изменения прав доступа</span>
    <div id="status" class="chips"></div>
    <div class="actions">
      <a class="button ghost" href="/reference">Справочник</a>
      <button id="refresh" class="button" type="button">Обновить</button>
    </div>
  </header>

  <div id="bar">
    <nav class="tabs">
      <button type="button" data-tab="queue" class="active">Очередь</button>
      <button type="button" data-tab="history">История</button>
    </nav>
    <section id="filters">
      <input id="search" type="search" placeholder="Субъект, объект или инициатор">
      <select id="state" title="Какие изменения показывать">
        <option value="open">Открытые</option>
        <option value="resolved">Разобранные</option>
        <option value="all">Все</option>
      </select>
      <select id="outcome" title="Решение аналитика" disabled>
        <option value="">Любое решение</option>
        <option value="confirmed">Подтверждено</option>
        <option value="false_positive">Ложное срабатывание</option>
        <option value="accepted_risk">Принятый риск</option>
      </select>
      <select id="group" title="Сгруппировать очередь">
        <option value="none">Без группировки</option>
        <option value="subject">По субъекту</option>
        <option value="object">По объекту</option>
      </select>
    </section>
    <span id="counter" class="counter"></span>
  </div>

  <main id="workspace">
    <section id="queue" class="panel"></section>
    <article id="card" class="panel">
      <p class="empty">Выберите изменение слева.<br>
        Система покажет, что в нём необычного и на какие связи она опиралась.
        Решение принимает специалист — она лишь раскладывает основания.</p>
    </article>
  </main>

  <section id="history" class="panel" hidden></section>

  <div id="selection" hidden>
    <span id="selected"></span>
    <input id="note" type="text" placeholder="Заметка к решению">
    <button type="button" class="button" data-outcome="confirmed">Подтверждено</button>
    <button type="button" class="button" data-outcome="false_positive">Ложное срабатывание</button>
    <button type="button" class="button" data-outcome="accepted_risk">Принятый риск</button>
    <button type="button" class="button" data-outcome="reopened" id="reopen" hidden>Вернуть в работу</button>
    <button type="button" class="button ghost" id="clear">Снять</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
